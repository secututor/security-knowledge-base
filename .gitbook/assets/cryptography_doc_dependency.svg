<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" role="img" aria-label="Cryptography 문서 간 의존 관계도">
  <title>Cryptography 문서 간 의존 관계</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <style>
      .done { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
      .todo { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 4; }
      .t1 { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .t2 { font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 13px; fill: #374151; text-anchor: middle; }
      .edge { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .lg { font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 13px; fill: #6b7280; }
    </style>
  </defs>

  <!-- edges -->
  <line class="edge" x1="300" y1="76" x2="200" y2="118"/>
  <line class="edge" x1="340" y1="76" x2="440" y2="118"/>
  <line class="edge" x1="190" y1="176" x2="290" y2="218"/>
  <line class="edge" x1="450" y1="176" x2="450" y2="318"/>
  <line class="edge" x1="340" y1="276" x2="430" y2="318"/>
  <line class="edge" x1="300" y1="276" x2="210" y2="318"/>
  <line class="edge" x1="190" y1="376" x2="190" y2="418"/>
  <line class="edge" x1="450" y1="376" x2="450" y2="418"/>
  <line class="edge" x1="420" y1="376" x2="220" y2="418"/>
  <line class="edge" x1="220" y1="376" x2="420" y2="418"/>
  <line class="edge" x1="190" y1="476" x2="295" y2="518"/>
  <line class="edge" x1="450" y1="476" x2="345" y2="518"/>

  <!-- L0 -->
  <rect class="done" x="220" y="20" width="200" height="56" rx="8"/>
  <text class="t1" x="320" y="44">01 Overview</text>
  <text class="t2" x="320" y="64">암호학 개요 · 완료</text>

  <!-- L1 -->
  <rect class="done" x="90" y="120" width="200" height="56" rx="8"/>
  <text class="t1" x="190" y="144">02 Symmetric</text>
  <text class="t2" x="190" y="164">대칭키 암호 · 완료</text>
  <rect class="done" x="350" y="120" width="200" height="56" rx="8"/>
  <text class="t1" x="450" y="144">03 Hashing &amp; MAC</text>
  <text class="t2" x="450" y="164">해시·MAC·KDF · 완료</text>

  <!-- L2 -->
  <rect class="done" x="220" y="220" width="200" height="56" rx="8"/>
  <text class="t1" x="320" y="244">04 Asymmetric</text>
  <text class="t2" x="320" y="264">공개키 암호·PQC · 완료</text>

  <!-- L3 -->
  <rect class="todo" x="90" y="320" width="200" height="56" rx="8"/>
  <text class="t1" x="190" y="344">06 Key Exchange</text>
  <text class="t2" x="190" y="364">키 교환·ML-KEM · 예정</text>
  <rect class="todo" x="350" y="320" width="200" height="56" rx="8"/>
  <text class="t1" x="450" y="344">05 Digital Signature</text>
  <text class="t2" x="450" y="364">디지털 서명 · 예정</text>

  <!-- L4 -->
  <rect class="todo" x="90" y="420" width="200" height="56" rx="8"/>
  <text class="t1" x="190" y="444">07 Key Management</text>
  <text class="t2" x="190" y="464">키 관리 · 예정</text>
  <rect class="todo" x="350" y="420" width="200" height="56" rx="8"/>
  <text class="t1" x="450" y="444">08 TLS Overview</text>
  <text class="t2" x="450" y="464">TLS 핸드셰이크 · 예정</text>

  <!-- L5 -->
  <rect class="todo" x="220" y="520" width="200" height="56" rx="8"/>
  <text class="t1" x="320" y="544">09 In Practice</text>
  <text class="t2" x="320" y="564">도메인별 적용 · 예정</text>

  <!-- legend -->
  <rect class="done" x="140" y="606" width="28" height="18" rx="4"/>
  <text class="lg" x="176" y="620">작성 완료 (실선)</text>
  <rect class="todo" x="340" y="606" width="28" height="18" rx="4"/>
  <text class="lg" x="376" y="620">작성 예정 (점선)</text>
</svg>
